<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">V6 港口全业务协同策略证据摘要</title>
  <desc id="desc">Thirteen business domains, a 110-dimensional observation contract, eighteen continuous recommendation actions, offline SAC training, paired forward evaluation, and fail-closed production boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071426"/><stop offset="0.5" stop-color="#0a1f38"/><stop offset="1" stop-color="#071b25"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .card{fill:#0c2139;stroke:#275276;stroke-width:1.5}
      .opt{fill:#0b2c36;stroke:#1c8b82;stroke-width:1.5}
      .det{fill:#2b2416;stroke:#9a6c20;stroke-width:1.5}
      .muted{fill:#9fb4ca}.light{fill:#edf7ff}.cyan{fill:#7dd3fc}.green{fill:#86efac}.amber{fill:#fde68a}
    </style>
  </defs>
  <rect width="1600" height="940" rx="28" fill="url(#bg)"/>
  <g opacity=".2" stroke="#60a5fa" stroke-width="1">
    <path d="M0 118h1600M0 318h1600M0 578h1600M0 818h1600"/>
    <path d="M160 0v940M320 0v940M480 0v940M640 0v940M800 0v940M960 0v940M1120 0v940M1280 0v940M1440 0v940"/>
  </g>
  <ellipse cx="250" cy="150" rx="230" ry="130" fill="#0ea5e9" opacity=".10" filter="url(#soft)"/>
  <ellipse cx="1350" cy="760" rx="260" ry="150" fill="#10b981" opacity=".08" filter="url(#soft)"/>

  <g class="sans">
    <text x="72" y="72" class="cyan" font-size="19" font-weight="800" letter-spacing="3">PORT_OPS_V6 · MACHINE-READABLE OFFLINE EVIDENCE</text>
    <text x="72" y="120" class="light" font-size="38" font-weight="850">V6 港口全业务协同策略证据摘要</text>
    <text x="72" y="155" class="muted" font-size="20">Coordinated business policy · replaceable data contract · independent forward challenge</text>
    <rect x="1240" y="60" width="288" height="54" rx="27" fill="#3d240b" stroke="#f59e0b" stroke-width="2"/>
    <text x="1275" y="94" class="amber" font-size="18" font-weight="800">PRODUCTION AUTHORITY: FALSE</text>

    <g transform="translate(72 195)">
      <rect class="card" width="310" height="104" rx="16"/>
      <text x="24" y="35" class="cyan" font-size="15" font-weight="750">OBSERVATION CONTRACT</text>
      <text x="24" y="75" class="light" font-size="34" font-weight="850">110D</text>
      <text x="122" y="74" class="muted" font-size="16">features + masks + queues</text>
    </g>
    <path d="M397 247h85" stroke="url(#flow)" stroke-width="4"/><path d="m480 239 16 8-16 8" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <g transform="translate(512 195)">
      <rect class="card" width="270" height="104" rx="16"/>
      <text x="24" y="35" fill="#c4b5fd" font-size="15" font-weight="750">SELECTED LEARNER</text>
      <text x="24" y="75" class="light" font-size="30" font-weight="850">SAC · seed 726</text>
      <text x="24" y="94" class="muted" font-size="13">3 seeds × 30,000 optimizer steps</text>
    </g>
    <path d="M797 247h85" stroke="url(#flow)" stroke-width="4"/><path d="m880 239 16 8-16 8" fill="none" stroke="#34d399" stroke-width="4"/>
    <g transform="translate(912 195)">
      <rect class="card" width="300" height="104" rx="16"/>
      <text x="24" y="35" class="green" font-size="15" font-weight="750">RECOMMENDATION ACTIONS</text>
      <text x="24" y="75" class="light" font-size="34" font-weight="850">18D</text>
      <text x="120" y="74" class="muted" font-size="16">continuous resource ratios</text>
    </g>
    <path d="M1227 247h62" stroke="#f59e0b" stroke-width="4"/><path d="m1287 239 16 8-16 8" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <g transform="translate(1319 195)">
      <rect x="0" y="0" width="209" height="104" rx="16" fill="#2b2416" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="35" class="amber" font-size="15" font-weight="750">HARD BOUNDARIES</text>
      <text x="20" y="64" class="light" font-size="16" font-weight="750">safety · law · approval</text>
      <text x="20" y="88" class="muted" font-size="13">cannot be traded for reward</text>
    </g>

    <text x="72" y="350" class="light" font-size="25" font-weight="800">13 个业务域 / 13 business domains</text>
    <text x="500" y="350" class="green" font-size="15" font-weight="750">● 9 RL / optimizer outputs</text>
    <text x="745" y="350" class="amber" font-size="15" font-weight="750">● 4 deterministic governance / safety / accounting functions</text>

    <g transform="translate(72 380)">
      <g transform="translate(0 0)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">船舶到港与泊位</text><text x="18" y="60" class="muted" font-size="12">Vessel · berth · pilotage · towage</text></g>
      <g transform="translate(288 0)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">岸桥装卸</text><text x="18" y="60" class="muted" font-size="13">Quay-crane operations</text></g>
      <g transform="translate(576 0)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">堆场与场桥</text><text x="18" y="60" class="muted" font-size="13">Yard &amp; yard crane</text></g>
      <g transform="translate(864 0)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">水平运输</text><text x="18" y="60" class="muted" font-size="13">Horizontal transport</text></g>
      <g transform="translate(1152 0)"><rect class="opt" width="304" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">闸口 · 铁路 · 驳船</text><text x="18" y="60" class="muted" font-size="13">Gate · rail · barge</text></g>

      <g transform="translate(0 100)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">微电网与储能</text><text x="18" y="60" class="muted" font-size="13">Microgrid &amp; BESS</text></g>
      <g transform="translate(288 100)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">冷藏箱与岸电</text><text x="18" y="60" class="muted" font-size="13">Reefer &amp; shore power</text></g>
      <g transform="translate(576 100)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">设备健康与维护</text><text x="18" y="60" class="muted" font-size="13">Maintenance resources</text></g>
      <g transform="translate(864 100)"><rect class="opt" width="270" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">监管延误韧性</text><text x="18" y="60" class="muted" font-size="13">Regulatory resilience</text></g>
      <g transform="translate(1152 100)"><rect class="det" width="304" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">气象海况与封复航</text><text x="18" y="60" class="muted" font-size="13">Weather &amp; navigation safety</text></g>

      <g transform="translate(0 200)"><rect class="det" width="450" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">安全审批、回滚与审计</text><text x="18" y="60" class="muted" font-size="13">Approval · rollback · audit</text></g>
      <g transform="translate(468 200)"><rect class="det" width="450" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">成本、碳与峰值核算</text><text x="18" y="60" class="muted" font-size="13">Cost · carbon · peak accounting</text></g>
      <g transform="translate(936 200)"><rect class="det" width="520" height="84" rx="14"/><text x="18" y="34" class="light" font-size="17" font-weight="800">跨港迁移与漂移治理</text><text x="18" y="60" class="muted" font-size="13">Transfer &amp; drift governance</text></g>
    </g>

    <g transform="translate(72 700)">
      <rect class="card" width="1456" height="150" rx="18"/>
      <text x="24" y="35" class="cyan" font-size="17" font-weight="800">SEALED 2026 FORWARD CHALLENGE · 20 PAIRED WINDOWS × 48 HOURS</text>
      <g transform="translate(24 54)">
        <text x="0" y="34" class="light" font-size="29" font-weight="850">+15.77%</text><text x="0" y="58" class="muted" font-size="13">vs FCFS · 95% CI 10.18–21.18</text>
        <text x="292" y="34" class="light" font-size="29" font-weight="850">+22.94%</text><text x="292" y="58" class="muted" font-size="13">vs fixed rule · 95% CI 19.17–26.49</text>
        <text x="600" y="34" class="green" font-size="29" font-weight="850">19 / 19</text><text x="600" y="58" class="muted" font-size="13">admission checks passed</text>
        <text x="850" y="34" class="green" font-size="29" font-weight="850">0</text><text x="850" y="58" class="muted" font-size="13">guardrail violations</text>
        <text x="1060" y="34" class="amber" font-size="22" font-weight="850">OFFLINE ONLY</text><text x="1060" y="58" class="muted" font-size="13">not a measured terminal KPI</text>
      </g>
    </g>
    <text x="72" y="895" class="muted" font-size="15">Public aggregates + reanalysis + declared replaceable engineering parameters · failed candidates and artifact hashes retained append-only</text>
    <text x="72" y="920" class="amber" font-size="15" font-weight="750">Recommendation only · no schedule commitment · no regulatory release · no navigation approval · no equipment actuation</text>
  </g>
</svg>

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1
      - name: Dependency vulnerability audit
        run: python -m pip_audit --local
      - name: Compile Python
        run: python -m compileall -q app scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify fixed business KPI evidence
        run: |
          python -m scripts.business_kpi_benchmark --verify
          python -m scripts.release_check
      - name: Five-controller smoke test
        run: python -m scripts.rl_smoke_test --steps 64

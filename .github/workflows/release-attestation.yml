name: release-attestation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  source:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/port-dt-multi-${GITHUB_REF_NAME}.tar.gz HEAD
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/port-dt-multi-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Attest source provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/port-dt-multi-${{ github.ref_name }}.tar.gz
      - name: Attest source SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/port-dt-multi-${{ github.ref_name }}.tar.gz
          sbom-path: dist/port-dt-multi-${{ github.ref_name }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: port-dt-multi-${{ github.ref_name }}
          path: dist/
